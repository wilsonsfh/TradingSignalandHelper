# Cloudflare Tunnel config for the local TradingSignalandHelper bridge.
# Copy to config.yml and fill in the placeholders. config.yml is git-ignored.
#
# This exposes the LOCAL Flask bridge (python cli.py web, 127.0.0.1:5000) at a stable
# HTTPS hostname on your PERSONAL Cloudflare account, so TradingView (or the
# signal-notifier Worker) can reach /webhook and you can reach the dashboard behind
# Cloudflare Access. The bridge — with OpenD — keeps running locally; the tunnel is
# just the front door.

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: REPLACE_WITH_HOME/.cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: signal-bridge.example.com   # a hostname on a zone in your personal account
    service: http://127.0.0.1:5000
  - service: http_status:404
